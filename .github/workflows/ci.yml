name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustup reads rust-toolchain.toml (pinned version + rustfmt + clippy).
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The CUDA backend must keep compiling; no toolkit needed (driver loaded at runtime).
      - run: cargo clippy -p chess-train --features cuda --all-targets -- -D warnings
      # chess-search alone: fails if it uses a concrete evaluator instead of the trait.
      - run: cargo check -p chess-search
      # NNUE kernels: AVX2 on x86-64, portable code elsewhere; keep both compiling.
      - name: Clippy chess-eval for AArch64
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cargo clippy -p chess-eval --lib --target aarch64-unknown-linux-gnu -- -D warnings
      - run: cargo test --workspace
      - name: Deep perft (release)
        run: cargo test --release -p chess-core --test perft -- --include-ignored

      - name: TypeScript bindings are up to date
        run: |
          if [ -n "$(git status --porcelain web/src/api/generated)" ]; then
            git status --porcelain web/src/api/generated
            echo "::error::Generated types changed: run 'just gen-types' and commit web/src/api/generated"
            exit 1
          fi

  web:
    name: Front (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  docker:
    name: Docker image ${{ matrix.name }}
    needs: [rust, web]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            file: docker/Dockerfile.engine
            target: runtime
            platforms: linux/amd64,linux/arm64
          - name: web
            file: docker/Dockerfile.web
            target: runtime
            platforms: linux/amd64,linux/arm64
          - name: train-cuda
            file: docker/Dockerfile.train
            target: runtime-cuda
            platforms: linux/amd64
          - name: train-cpu
            file: docker/Dockerfile.train
            target: runtime-cpu
            platforms: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Free disk space (CUDA images are large)
        if: matrix.name == 'train-cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platforms }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
