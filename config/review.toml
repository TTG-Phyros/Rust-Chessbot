# Chess.com game reviews (chess-reviewer, chess-server).
#
# Every key can be overridden by a CHESS_REVIEW_* variable (`__` between a
# section and its key, e.g. CHESS_REVIEW_CHESSCOM__MAX_RETRIES=3), and this
# file replaced by CHESS_REVIEW_CONFIG. The values below are the defaults.

# User-Agent sent to Chess.com: the application and a way to contact you.
# No default: set CHESS_REVIEW_USER_AGENT in .env (see .env.example).
# user_agent = "chess-bot/0.1 (you@example.com)"

# SQLite cache of games and analyses (a named volume in Docker).
cache = "data/review/cache.sqlite"
# Most games one review may ask for.
max_games = 200

[chesscom]
base_url = "https://api.chess.com/pub"
# Requests are sent one at a time, at least this far apart.
min_interval_ms = 200
# Rate-limited (429) or failed requests: retries, exponential backoff.
max_retries = 5
initial_backoff_ms = 1000
max_backoff_ms = 60000
timeout_secs = 30
# The list of months and the current month are revalidated after this many
# seconds; past months are never downloaded twice.
recent_ttl_secs = 600

# Engine searches. The user picks a preset (with an estimate of the time it
# takes for the games asked: POST /api/review/estimate), or sets a depth or a
# time and a number of lines. An analysis is cached per engine and settings:
# other settings analyse the games again.
[analysis]
# "stockfish" (the reference) or "native" (our engine).
engine = "stockfish"
# Preset of the requests that name none.
preset = "deep"
# Games analysed at once, one engine (one CPU core) each; 0 = half the cores.
workers = 0

# Presets, fastest first: depth (or movetime_ms, a time per position) and
# lines per position (at least 2 to recognise the only good move).
# Measured on an i7-9700KF (Stockfish 19, one core per game): about 0.05,
# 0.16 and 0.75 s per position; a blitz game has about 80 positions.
[[analysis.presets]]
name = "fast"
label = "Rapide"
depth = 12
multipv = 2

[[analysis.presets]]
name = "balanced"
label = "Équilibré"
depth = 14
multipv = 2

[[analysis.presets]]
name = "deep"
label = "Approfondi"
depth = 16
multipv = 3

[stockfish]
binary = "stockfish"
threads = 1
hash_mb = 64

[native]
# Network used when it exists; classical evaluation otherwise.
eval_file = "data/weights/main.nnue"
hash_mb = 64
