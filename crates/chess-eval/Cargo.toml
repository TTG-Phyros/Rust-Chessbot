[package]
name = "chess-eval"
description = "The `Evaluator` trait and its implementations (classical, NNUE)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["classic", "nnue"]
# Material + tapered piece-square tables.
classic = []
# Quantized neural network (weights loaded at runtime).
nnue = ["dep:thiserror"]

[dependencies]
chess-core.workspace = true
thiserror = { workspace = true, optional = true }

[lints]
workspace = true
