[package]
name = "chess-server"
description = "HTTP + WebSocket API exposing the engine and training metrics to the web UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "chess-server"
path = "src/main.rs"

[dependencies]
chess-core.workspace = true
chess-eval = { workspace = true, features = ["classic", "nnue"] }
chess-search.workspace = true
chess-stockfish.workspace = true
chess-chesscom.workspace = true
chess-review.workspace = true
chess-reviewer.workspace = true
anyhow.workspace = true
axum.workspace = true
figment.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
ts-rs.workspace = true
utoipa.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tokio-tungstenite.workspace = true
tower.workspace = true

[lints]
workspace = true
