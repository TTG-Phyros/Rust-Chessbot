[package]
name = "chess-train"
description = "Self-play data generation, NNUE training (burn, CUDA or CPU) and weight export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "chess-train"
path = "src/main.rs"

[features]
default = []
# NVIDIA GPU backend. Enabled in the CUDA Docker image; without it the CPU
# (flex) backend is used. With it, the CPU backend remains the fallback when
# no GPU is detected at runtime.
cuda = ["burn/cuda", "dep:cudarc"]

[dependencies]
chess-core.workspace = true
chess-eval = { workspace = true, features = ["classic", "nnue"] }
chess-search.workspace = true
chess-stockfish.workspace = true
anyhow.workspace = true
burn.workspace = true
clap.workspace = true
ctrlc.workspace = true
cudarc = { workspace = true, optional = true }
figment.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
figment = { workspace = true, features = ["test"] }
tower.workspace = true

[lints]
workspace = true
