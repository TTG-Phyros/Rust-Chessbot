# docker compose up                          -> UI + API on http://localhost:8080
# docker compose --profile train up          -> training on the NVIDIA GPU
# docker compose --profile train-cpu up      -> training on the CPU (no CUDA)

name: chess-bot

x-train-common: &train-common
  # Linux: set CHESS_UID/CHESS_GID to your ids (`id -u`, `id -g`) so files
  # written to ./data belong to you. Docker Desktop (Windows/macOS) needs nothing.
  user: "${CHESS_UID:-10001}:${CHESS_GID:-10001}"
  environment:
    # Passed through from the host when set; each binary has quiet defaults.
    RUST_LOG:
    # Name of the training run (datasets, checkpoints, weights); default "main".
    CHESS_TRAIN_RUN:
    # Configuration file inside the container, e.g. /data/chess-train.toml (./data
    # on the host). Other CHESS_TRAIN_* settings only reach the container if listed here.
    CHESS_TRAIN_CONFIG:
  # SIGTERM finishes the current step and writes a checkpoint: give it time.
  stop_grace_period: 2m
  # Control daemon: the UI starts and stops runs through chess-server;
  # --autostart begins training as soon as the service is up.
  command: ["serve", "--autostart"]
  networks:
    default:
      # chess-server reaches the daemon (GPU or CPU flavour) at http://trainer:4000.
      aliases: [trainer]
  volumes:
    # Weights, checkpoints and metrics, shared with the server and readable from the host.
    - ./data:/data
    # Datasets are streamed during training: a named volume lives on the Linux
    # filesystem of the Docker VM, much faster than a Windows bind mount.
    - datasets:/datasets

services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.engine
    image: chess-bot/server:dev
    user: "${CHESS_UID:-10001}:${CHESS_GID:-10001}"
    environment:
      CHESS_SERVER_BIND: 0.0.0.0:3000
      CHESS_SERVER_DATA_DIR: /data
      CHESS_SERVER_LOG_FORMAT: ${CHESS_SERVER_LOG_FORMAT:-pretty}
      # The engine plays with the network of this run as soon as it exists.
      CHESS_SERVER_EVAL_FILE: /data/weights/${CHESS_TRAIN_RUN:-main}.nnue
      # Training control daemon (only reachable with --profile train or train-cpu).
      CHESS_SERVER_TRAINER_URL: http://trainer:4000
      # Chess.com reviews: engine and analysis settings in ./config/review.toml.
      # The User-Agent (required by Chess.com) comes from .env (see .env.example).
      CHESS_REVIEW_CONFIG: /config/review.toml
      CHESS_REVIEW_USER_AGENT: ${CHESS_REVIEW_USER_AGENT:-}
      CHESS_REVIEW_CACHE: /cache/review.sqlite
      CHESS_REVIEW_ELO_MODEL: /config/elo-model.json
      # Reviews by our own engine use the network of this run.
      CHESS_REVIEW_NATIVE__EVAL_FILE: /data/weights/${CHESS_TRAIN_RUN:-main}.nnue
      RUST_LOG:
    volumes:
      - ./data:/data
      - ./config:/config:ro
      # SQLite cache of games and analyses: a named volume (SQLite on a
      # Windows bind mount is slow and its locking unreliable).
      - review-cache:/cache
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: chess-bot/web:dev
    ports:
      - "${CHESS_WEB_PORT:-8080}:8080"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

  train:
    <<: *train-common
    profiles: [train]
    build:
      context: .
      dockerfile: docker/Dockerfile.train
      target: runtime-cuda
    image: chess-bot/train:cuda
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  train-cpu:
    <<: *train-common
    profiles: [train-cpu]
    build:
      context: .
      dockerfile: docker/Dockerfile.train
      target: runtime-cpu
    image: chess-bot/train:cpu

volumes:
  datasets:
  review-cache:
